{% extends "base.html" %}
{% set public = true %}
{% block title %}Error {{ code }}{% endblock %}
{% block content %}
<div class="card" style="text-align:center;max-width:520px;margin:3rem auto">
  <div style="font-size:3.5rem;font-weight:800;color:var(--brand)">{{ code }}</div>
  <p>{{ message }}</p>
  <a class="btn" href="{{ url_for('main.index') }}">Back to home</a>
</div>
{% endblock %}
